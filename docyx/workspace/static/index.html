<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Docyx workspace</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><rect width="16" height="16" rx="3" fill="%230f1011"/><rect x="3" y="3" width="4" height="4" rx="1" fill="%231fbf62"/><rect x="9" y="3" width="4" height="4" rx="1" fill="%234b90f7"/><rect x="3" y="9" width="4" height="4" rx="1" fill="%23f2a413"/><rect x="9" y="9" width="4" height="4" rx="1" fill="%23cc66f0"/></svg>'>
<style>
  /* Surface, ink, hairline and radius ladders are Linear's, via getdesign.md.
     The landing-page half of that system (96px sections, 80px display type)
     is deliberately not here: this is a dense inspection surface. */
  :root {
    --bench: #010102;
    --surface-1: #0f1011; --surface-3: #18191a;
    --hair: #23252a; --hair-strong: #34343a;
    --ink: #f7f8f8; --ink-muted: #d0d6e0; --ink-subtle: #8a8f98;
    --ink-tertiary: #62666d;

    /* Lavender is chrome, never data — brand mark and focus rings only.
       Focus previously used the `detected` blue, which made a focus ring
       and a detector's claim the same colour. */
    --accent: #5e6ad2; --accent-hover: #828fff;

    /* Tiers are a schema contract, not a palette choice: saturated on
       purpose, because they ARE the data. `edited` sits magenta-side of
       the lavender so a focus ring can never be read as an edit. */
    --exact: #1fbf62; --detected: #4b90f7; --inferred: #f2a413;
    --edited: #cc66f0; --fail: #e5484d;

    --r-xs: 4px; --r-md: 8px;

    /* Segoe UI speaks for Docyx. Consolas quotes the machine. Never mixed. */
    --voice: "Inter", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    --machine: "Cascadia Mono", ui-monospace, Consolas, monospace;
  }

  /* A light bench for a lit room. The tier hues are a contract, so they are
     re-tuned rather than replaced: the same four meanings, darkened enough to
     hold their own against white paper instead of against near-black. */
  [data-theme="light"] {
    --bench: #eceef0;
    --surface-1: #ffffff; --surface-3: #e6e9ec;
    --hair: #d8dce1; --hair-strong: #b9c0c8;
    --ink: #1a1d21; --ink-muted: #3d444c; --ink-subtle: #666e77;
    --ink-tertiary: #8a929b;
    --exact: #12874a; --detected: #1f63c8; --inferred: #a96a00;
    --edited: #8b2fb8; --fail: #c02a2f;
  }

  * { box-sizing: border-box; }
  html { scrollbar-color: var(--hair-strong) transparent; scrollbar-width: thin; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bench); color: var(--ink);
    font: 13px/1.55 var(--voice); display: flex; flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }

  /* A label is Docyx naming something. Small, tracked, quiet. */
  .label {
    font: 600 10px/1 var(--voice); letter-spacing: .12em;
    text-transform: uppercase; color: var(--ink-tertiary);
  }
  .mono { font-family: var(--machine); font-variant-numeric: tabular-nums; }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ── bench header ───────────────────────────────────────────── */
  header { background: var(--surface-1); border-bottom: 1px solid var(--hair); }
  .bar {
    display: flex; align-items: baseline; gap: 14px; padding: 12px 16px;
  }
  .mark {
    font: 700 11px/1 var(--voice); letter-spacing: .22em; color: var(--ink);
    padding-right: 14px; border-right: 1px solid var(--hair-strong);
  }
  #file { font-family: var(--machine); font-size: 13px; }
  .verdict { display: flex; align-items: baseline; gap: 8px; }
  .verdict b {
    font: 600 11px/1 var(--voice); letter-spacing: .08em; text-transform: uppercase;
  }
  .v-ok b { color: var(--exact); } .v-partial b { color: var(--inferred); }
  .v-failed b { color: var(--fail); }
  .grow { flex: 1; }

  header nav { display: flex; align-items: center; gap: 4px; }
  .sep { width: 1px; height: 16px; background: var(--hair-strong); margin: 0 6px; }
  #toast { position: fixed; bottom: 46px; left: 50%; transform: translateX(-50%);
           background: var(--surface-3); border: 1px solid var(--hair-strong);
           border-radius: var(--r-md); padding: 8px 14px; font-size: 12px;
           font-family: var(--machine); color: var(--ink-muted);
           box-shadow: 0 8px 24px #000a; }
  #toast[hidden] { display: none; }
  #toast.bad { border-color: var(--fail); color: var(--fail); }
  button {
    background: none; color: var(--ink-subtle); border: 1px solid transparent;
    border-radius: var(--r-xs); padding: 4px 8px; cursor: pointer; font: inherit;
  }
  button:hover:not(:disabled) { color: var(--ink); background: var(--surface-3); }
  button:disabled { opacity: .3; cursor: default; }
  /* A toggle has to look pressed; aria-pressed alone tells only a reader. */
  button[aria-pressed="true"]:not(.tier) { color: var(--ink); background: var(--surface-3);
                                border-color: var(--hair-strong); }
  #pageno { font-family: var(--machine); font-variant-numeric: tabular-nums;
            color: var(--ink-subtle); font-size: 12px; min-width: 66px; text-align: center; }

  /* Composition, not verdict: the word in the header and the banner carry
     that. Kept dim so a green bar can never outshout a PARTIAL status. */
  #trust { display: flex; height: 2px; background: var(--bench); opacity: .6; }
  #trust div { transition: opacity .15s; }

  /* ── outline: the page as a reading-order list ──────────────────
     The return half of the selection loop. Ordered by `reading_order`,
     so the list IS the claim being made about the page — a wrong order
     is visible here as prose that stops making sense. */
  #outline { width: 250px; flex: none; overflow: auto;
             border-right: 1px solid var(--hair); background: var(--surface-1); }
  .row { display: flex; align-items: baseline; gap: 8px; padding: 5px 12px;
         cursor: pointer; border-left: 2px solid transparent; }
  .row:hover { background: var(--surface-3); }
  .row[aria-selected="true"] { background: var(--surface-3);
                               border-left-color: var(--accent); }
  .row .n { font-family: var(--machine); font-variant-numeric: tabular-nums;
            font-size: 11px; color: var(--ink-tertiary); width: 22px;
            text-align: right; flex: none; }
  .row i { width: 6px; height: 6px; border-radius: 2px; flex: none; }
  .row .t { flex: 1; font-size: 12px; color: var(--ink-subtle);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row[aria-selected="true"] .t { color: var(--ink); }

  /* ── bench + rail ───────────────────────────────────────────── */
  main { flex: 1; display: flex; min-height: 0; }
  #bench { position: relative;
    flex: 1; overflow-y: auto; overflow-x: hidden; padding: 24px; display: flex;
    justify-content: center; align-items: flex-start;
    background:
      var(--bench);
  }
  canvas { display: block; cursor: crosshair; background: #fff;
           box-shadow: 0 0 0 1px #0006, 0 18px 40px -16px #000c; }
  [data-theme="light"] canvas { box-shadow: 0 0 0 1px #0003, 0 10px 28px -14px #0006; }

  /* Zoom floats over the page rather than sitting in the header: it belongs
     to the page, and it has to stay reachable while the page is scrolled. */
  #zoom { position: absolute; right: 22px; bottom: 18px; display: flex;
          align-items: center; gap: 2px; padding: 3px;
          background: var(--surface-1); border: 1px solid var(--hair);
          border-radius: 999px; box-shadow: 0 6px 20px #0006; }
  #zoom button { border-radius: 999px; padding: 3px 7px; }
  #pct { font-family: var(--machine); font-variant-numeric: tabular-nums;
         font-size: 11px; color: var(--ink-subtle); min-width: 42px;
         text-align: center; }

  aside {
    width: 372px; flex: none; border-left: 1px solid var(--hair);
    background: var(--surface-1); overflow: auto; padding: 0 0 20px;
  }
  .sect { padding: 16px; border-bottom: 1px solid var(--hair); }

  .issue { display: flex; gap: 8px; padding: 12px 16px;
           border-bottom: 1px solid var(--hair); background: #221b10; }
  .issue.err { background: #241416; }
  .issue span { color: var(--inferred); font-size: 12px; line-height: 1.2; }
  .issue.err span { color: var(--fail); }
  .issue code { font-family: var(--machine); font-size: 11px; color: var(--inferred);
                display: block; margin-bottom: 3px; }
  .issue.err code { color: var(--fail); }
  .issue p { margin: 0; color: var(--ink-subtle); font-size: 12px; }

  /* The claim: what this element says it is, and what it says. */
  .claim { font-family: var(--machine); font-size: 12px; color: var(--ink-subtle); }
  .claim b { color: var(--ink); }
  .said {
    margin: 8px 0 0; padding: 12px; background: var(--bench);
    border-left: 2px solid var(--hair-strong); border-radius: 0 var(--r-md) var(--r-md) 0;
    font-size: 14px; line-height: 1.5; word-break: break-word;
  }
  .said.rtl { direction: rtl; text-align: right;
              border-left: none; border-right: 2px solid var(--hair-strong);
              border-radius: var(--r-md) 0 0 var(--r-md); }
  .was { color: var(--ink-tertiary); text-decoration: line-through;
         margin: 8px 0 0;
         font-size: 12px; }
  .was + .said { margin-top: 4px; }
  .said[contenteditable] { cursor: text; }
  .said[contenteditable]:focus { outline: 2px solid var(--accent); outline-offset: 2px; }
  .editbar { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  /* A class-level `display` outranks the UA's [hidden] rule, so the bar
     showed with nothing to save. Same trap as #toast. */
  .editbar[hidden] { display: none; }
  .editbar .hint { font-family: var(--machine); font-size: 11px;
                   color: var(--ink-tertiary); }
  .editbar .err { color: var(--fail); font-size: 11px; }
  #save { background: var(--accent); color: #fff; }
  #save:hover:not(:disabled) { background: var(--accent-hover); color: #fff; }

  dl { display: grid; grid-template-columns: 96px 1fr; gap: 4px 12px; margin: 0; }
  dt { font: 600 10px/1.6 var(--voice); letter-spacing: .1em;
       text-transform: uppercase; color: var(--ink-tertiary); }
  dd { margin: 0; font-family: var(--machine); font-size: 12px; color: var(--ink-muted);
       word-break: break-word; }
  dd .sw { display: inline-block; width: 7px; height: 7px; border-radius: 2px;
           margin-right: 6px; vertical-align: baseline; }

  details summary { cursor: pointer; color: var(--ink-tertiary); list-style: none;
                    font: 600 10px/1 var(--voice); letter-spacing: .12em;
                    text-transform: uppercase; }
  details summary::-webkit-details-marker { display: none; }
  details summary::before { content: "+ "; font-family: var(--machine); }
  details[open] summary::before { content: "\2212 "; }
  details pre { margin: 10px 0 0; padding: 10px; background: var(--bench);
                border-radius: var(--r-md); font-family: var(--machine); font-size: 11px;
                line-height: 1.5; color: var(--ink-subtle); white-space: pre-wrap;
                word-break: break-word; }

  .empty { color: var(--ink-tertiary); font-size: 12px; }
  .empty kbd { font-family: var(--machine); font-size: 11px; color: var(--ink-subtle);
               border: 1px solid var(--hair-strong); border-radius: var(--r-xs);
               padding: 0 4px; }

  /* ── census: the legend carries data, and doubles as the filter ── */
  footer { display: flex; align-items: center; gap: 4px; padding: 8px 16px;
           border-top: 1px solid var(--hair); background: var(--surface-1); }
  #census { display: flex; align-items: center; gap: 4px; }
  #stats { font-family: var(--machine); font-variant-numeric: tabular-nums;
           font-size: 11px; color: var(--ink-tertiary); }
  .tier { display: flex; align-items: baseline; gap: 6px; padding: 4px 8px;
          border-radius: var(--r-xs); color: var(--ink-subtle); }
  .tier i { width: 8px; height: 8px; border-radius: 2px; align-self: center; }
  .tier b { font: 600 10px/1 var(--voice); letter-spacing: .1em;
            text-transform: uppercase; }
  .tier span { font-family: var(--machine); font-variant-numeric: tabular-nums;
               font-size: 12px; color: var(--ink-tertiary); }
  .tier[aria-pressed="false"] { opacity: .32; }
  .tier:hover { background: var(--surface-3); color: var(--ink); }

  @media (max-width: 860px) {
    main { flex-direction: column; }
    #outline { display: none; }
    aside { width: auto; border-left: none; border-top: 1px solid var(--hair); }
    .bar { flex-wrap: wrap; gap: 8px 12px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header>
  <div class="bar">
    <span class="mark">DOCYX</span>
    <span id="file">&mdash;</span>
    <span class="verdict" id="verdict"></span>
    <span class="grow"></span>
    <nav>
      <button id="undo" title="Undo (Ctrl+Z)">&#8630;</button>
      <button id="redo" title="Redo (Ctrl+Shift+Z)">&#8631;</button>
      <button id="export" title="Write the whole document beside the PDF">Export</button>
      <button id="import" title="Reattach edits from a previous export">Import</button>
      <span class="sep"></span>
      <button id="labels" title="Label every box (L)" aria-pressed="false">Labels</button>
      <button id="theme" title="Light or dark">&#9680;</button>
      <span class="sep"></span>
      <button id="prev" title="Previous page (&larr;)">&larr;</button>
      <span id="pageno">&mdash;</span>
      <button id="next" title="Next page (&rarr;)">&rarr;</button>
    </nav>
  </div>
  <div id="trust"></div>
</header>

<main>
  <div id="outline" role="listbox" aria-label="Elements in reading order"></div>
  <div id="bench">
    <canvas id="c" tabindex="0" aria-label="Page with extracted elements"></canvas>
    <div id="zoom">
      <button id="zoomOut" title="Zoom out (-)">&minus;</button>
      <span id="pct">&mdash;</span>
      <button id="zoomIn" title="Zoom in (+)">&plus;</button>
      <button id="zoomFit" title="Fit to window (0)">&#8634;</button>
    </div>
  </div>
  <aside>
    <div id="issues"></div>
    <div id="detail"></div>
  </aside>
</main>

<div id="toast" hidden></div>
<footer>
  <div id="census"></div>
  <span class="grow"></span>
  <span id="stats"></span>
</footer>

<script>
const TIERS = {
  exact:    { c: "#1fbf62", of: e => tier(e) === "exact" },
  detected: { c: "#4b90f7", of: e => tier(e) === "detected" },
  inferred: { c: "#f2a413", of: e => tier(e) === "inferred" },
  edited:   { c: "#cc66f0", of: e => tier(e) === "edited" },
};
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const $ = id => document.getElementById(id);

const state = {
  index: 0, elements: [], image: null, selected: null, hovered: null,
  scale: 1, hidden: new Set(), rows: [], top: [], history: { undo: 0, redo: 0 },
  conflicts: [], orphans: [],
  zoom: 1, fit: 1, labels: false,
};

// An edit outranks the confidence it replaced, so it is its own tier.
function tier(el) {
  if (el.provenance && el.provenance.modified_by_user) return "edited";
  return (el.confidence && el.confidence.type) || "unknown";
}
const colourOf = el => (TIERS[tier(el)] || { c: "#878d92" }).c;
const shown = () => state.elements.filter(el => !state.hidden.has(tier(el)));

function flatten(elements) {
  // Cells and style runs live in `children` and are selectable too; the
  // parent is pushed first so the child draws on top of it.
  const out = [];
  for (const el of elements || []) { out.push(el); out.push(...flatten(el.children)); }
  return out;
}

/* ── the page ─────────────────────────────────────────────────── */

function draw() {
  if (!state.image) return;
  const dpr = window.devicePixelRatio || 1;
  const avail = $("bench").clientWidth - 48;
  // Fit is the baseline; zoom multiplies it, so "100%" means the page fills
  // the bench rather than meaning 150 DPI. The percentage shown is the real
  // one against the image, which is what the manual's 42% refers to.
  state.fit = Math.min(1, avail / state.image.width);
  state.scale = state.fit * state.zoom;
  $("pct").textContent = `${Math.round(state.scale * 100)}%`;
  $("stats").textContent =
    `${state.image.width} × ${state.image.height} px · ${shown().length} boxes shown`;
  $("zoomFit").disabled = state.zoom === 1;
  const w = Math.round(state.image.width * state.scale);
  const h = Math.round(state.image.height * state.scale);

  canvas.width = w * dpr; canvas.height = h * dpr;
  canvas.style.width = w + "px"; canvas.style.height = h + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.drawImage(state.image, 0, 0, w, h);

  const rect = el => {
    const b = el.geometry.bbox, s = state.scale;
    return [b.x * s, b.y * s, b.width * s, b.height * s];
  };

  // The punch-out: scrim everything except the selection, so the element's
  // own pixels stay at full contrast and the page around it recedes.
  if (state.selected) {
    const [x, y, bw, bh] = rect(state.selected);
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, w, h);
    ctx.rect(x, y, bw, bh);
    ctx.fillStyle = "rgba(1,1,2,.46)";
    ctx.fill("evenodd");
    ctx.restore();
  }

  for (const el of shown()) {
    const [x, y, bw, bh] = rect(el);
    const sel = el === state.selected;
    ctx.lineWidth = sel ? 1.5 : 1;
    ctx.strokeStyle = sel ? "#fff" : (el === state.hovered ? "#ffffffaa" : colourOf(el) + "cc");
    ctx.strokeRect(x + .5, y + .5, bw, bh);
    if (sel || el === state.hovered || (state.labels && state.top.includes(el)))
      tag(el, x, y);

    if (sel) {
      // Handles only where a drag is allowed, so their absence is the answer
      // to "why can't I move this?" rather than a dead grab.
      if (movable(el)) {
        ctx.lineWidth = 1;
        for (const name of HANDLES) {
          const h = handlePos(el.geometry.bbox, name);
          const hx = Math.round(h.x * state.scale), hy = Math.round(h.y * state.scale);
          ctx.fillStyle = "#fff";
          ctx.strokeStyle = "#010102";
          ctx.fillRect(hx - 3, hy - 3, 6, 6);
          ctx.strokeRect(hx - 3.5, hy - 3.5, 7, 7);
        }
      }
    }
  }
}

/* `4. section_header` — the same number the outline shows, so the two panes
   name the element identically and neither needs a hover to be read. Off by
   default: 57 tags on a dense page hide the page. */
function tag(el, x, y) {
  const label = `${el.reading_order ?? "·"}. ${el.type}`;
  ctx.font = "600 10px ui-monospace, Consolas, monospace";
  const w = ctx.measureText(label).width + 8;
  // Above the box, unless that is off the top of the page.
  const ty = y < 13 ? y : y - 12;
  ctx.fillStyle = colourOf(el);
  ctx.fillRect(x, ty, w, 12);
  ctx.fillStyle = "#fff";
  ctx.fillText(label, x + 4, ty + 9);
}

function hit(ev) {
  const r = canvas.getBoundingClientRect();
  const x = (ev.clientX - r.left) / state.scale, y = (ev.clientY - r.top) / state.scale;
  let best = null;
  for (const el of shown()) {
    const b = el.geometry.bbox;
    if (x < b.x || x > b.x + b.width || y < b.y || y > b.y + b.height) continue;
    // Smallest hit wins, so a cell is reachable over the table holding it.
    if (!best || b.width * b.height < best.geometry.bbox.width * best.geometry.bbox.height) best = el;
  }
  return best;
}

/* ── moving and resizing a box ─────────────────────────────────
   Same rule as text: whole elements only. A span's box is a slice of its
   line's and a cell's of its table's, so dragging one would leave the
   parent's geometry describing an area it no longer covers. */

const HANDLES = ["nw", "n", "ne", "e", "se", "s", "sw", "w"];
const GRAB = 6;      // screen px of slop around a handle
const MIN_BOX = 4;   // a box smaller than this is a mis-drag, not a correction
let drag = null;

const movable = el => el && state.top.includes(el);

function point(ev) {
  const r = canvas.getBoundingClientRect();
  return { x: (ev.clientX - r.left) / state.scale, y: (ev.clientY - r.top) / state.scale };
}

function handlePos(b, name) {
  return {
    x: b.x + (name.includes("w") ? 0 : name.includes("e") ? b.width : b.width / 2),
    y: b.y + (name.includes("n") ? 0 : name.includes("s") ? b.height : b.height / 2),
  };
}

function handleAt(el, p) {
  const b = el.geometry.bbox, slop = GRAB / state.scale;
  return HANDLES.find(name => {
    const h = handlePos(b, name);
    return Math.abs(p.x - h.x) <= slop && Math.abs(p.y - h.y) <= slop;
  });
}

const within = (b, p) =>
  p.x >= b.x && p.x <= b.x + b.width && p.y >= b.y && p.y <= b.y + b.height;

/* Corners, not width/height: dragging an edge past the opposite one then
   normalises instead of producing a negative size. */
function resized(mode, b, dx, dy) {
  let [x0, y0, x1, y1] = [b.x, b.y, b.x + b.width, b.y + b.height];
  if (mode === "move") return { x: b.x + dx, y: b.y + dy, width: b.width, height: b.height };
  if (mode.includes("w")) x0 += dx;
  if (mode.includes("e")) x1 += dx;
  if (mode.includes("n")) y0 += dy;
  if (mode.includes("s")) y1 += dy;
  return {
    x: Math.min(x0, x1), y: Math.min(y0, y1),
    width: Math.max(MIN_BOX, Math.abs(x1 - x0)),
    height: Math.max(MIN_BOX, Math.abs(y1 - y0)),
  };
}

canvas.addEventListener("mousedown", ev => {
  const el = state.selected;
  if (!movable(el)) return;
  const p = point(ev);
  const mode = handleAt(el, p) || (within(el.geometry.bbox, p) ? "move" : null);
  if (!mode) return;
  ev.preventDefault();
  drag = { mode, from: p, box: { ...el.geometry.bbox }, moved: false };
});

canvas.addEventListener("mousemove", ev => {
  const p = point(ev);
  if (drag) {
    drag.moved = true;
    state.selected.geometry.bbox = resized(drag.mode, drag.box, p.x - drag.from.x, p.y - drag.from.y);
    draw();
    return;
  }
  const el = state.selected;
  const over = movable(el) ? handleAt(el, p) : null;
  canvas.style.cursor = over ? `${over}-resize`
    : movable(el) && within(el.geometry.bbox, p) ? "move" : "crosshair";
  const h = hit(ev);
  if (h !== state.hovered) { state.hovered = h; draw(); }
});

window.addEventListener("mouseup", () => {
  if (drag && drag.moved) commitMove(state.selected, drag.box);
  drag = null;
});

canvas.addEventListener("click", ev => {
  // A drag ends in a click; selecting the box under the cursor there would
  // undo the move the user just made by re-selecting something smaller.
  if (drag && drag.moved) return;
  select(hit(ev));
});
canvas.addEventListener("mouseleave", () => { state.hovered = null; draw(); });

async function commitMove(el, before) {
  const bbox = el.geometry.bbox;
  const body = await send("/api/move", { id: el.id, bbox });
  if (!body) { el.geometry.bbox = before; draw(); return; }
  patch(el, body.element);
  census(); buildOutline(); select(el);
}

/* ── the inspector ────────────────────────────────────────────── */

/* Reading order is the page's claim about itself, so it orders the outline,
   the arrow keys and nothing else. Elements it declines to number — tables,
   regions, style runs — fall to the end rather than interleaving. */
function ordered() {
  // Top-level only. A line's own style runs are not separate reading
  // positions, and listing 56 spans beside 10 lines buries the lines.
  // Children stay clickable on the page; the inspector counts them.
  return state.top.filter(el => !state.hidden.has(tier(el))).sort((a, b) => {
    const ao = a.reading_order, bo = b.reading_order;
    if (ao === bo) return a.geometry.bbox.y - b.geometry.bbox.y;
    if (ao === null || ao === undefined) return 1;
    if (bo === null || bo === undefined) return -1;
    return ao - bo;
  });
}

function buildOutline() {
  state.rows = ordered();
  const list = $("outline");
  list.innerHTML = state.rows.map((el, i) =>
    `<div class="row" data-i="${i}" role="option" aria-selected="false">
       <span class="n">${el.reading_order ?? "&middot;"}</span>
       <i style="background:${colourOf(el)}"></i>
       <span class="t">${esc(el.text || "(" + el.type + ")")}</span>
     </div>`).join("");
  for (const row of list.children)
    row.onclick = () => select(state.rows[+row.dataset.i]);
}

/* Every mutating route answers {element, history} and is reached through
   here, so an error surfaces once, in one place, as a toast. */
async function send(path, body) {
  try {
    const res = await fetch(`${path}?page=${state.index}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.status);
    if (data.history) setHistory(data.history);
    return data;
  } catch (e) {
    toast(String(e.message || e), true);
    return null;
  }
}

/* In place. state.elements, state.top and the outline all hold references to
   this object; replacing it would orphan every one of them. */
function patch(el, updated) {
  el.text = updated.text ?? null;
  el.geometry = updated.geometry;
  el.confidence = updated.confidence;
  el.provenance = updated.provenance;
}

function setHistory(history) {
  state.history = history || { undo: 0, redo: 0 };
  $("undo").disabled = !state.history.undo;
  $("redo").disabled = !state.history.redo;
}

let toastTimer;
function toast(message, bad) {
  const box = $("toast");
  box.textContent = message;
  box.className = bad ? "bad" : "";
  box.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { box.hidden = true; }, bad ? 6000 : 3500);
}

/* An import that silently dropped what it could not reattach would be worse
   than no import: the edits are gone and nothing says so. They surface as
   page issues, in the same place a gate warning does. */
const brief = v => typeof v === "object" && v
  ? `x ${Math.round(v.x)} y ${Math.round(v.y)} ${Math.round(v.width)}×${Math.round(v.height)}`
  : `"${v}"`;

function importIssues(index) {
  const rows = [];
  for (const c of state.conflicts.filter(c => c.page === index)) {
    rows.push([{
      code: "EDIT_CONFLICT",
      message: `${c.id} — the extractor now says ${brief(c.now)}, but the saved `
        + `edit was made against ${brief(c.then)}. Not applied.`,
    }, "err"]);
  }
  for (const o of state.orphans.filter(o => o.page === index)) {
    rows.push([{
      code: "EDIT_ORPHANED",
      message: `${o.id} no longer exists in this extraction. Its correction `
        + `could not be placed.`,
    }, "err"]);
  }
  return rows;
}

async function timeTravel(path) {
  const body = await send(path, {});
  if (!body) return;
  const el = state.elements.find(e => e.id === body.element.id);
  if (el) patch(el, body.element);
  census(); buildOutline(); select(el || null);
}

function select(el) {
  state.selected = el;
  for (const row of $("outline").children) {
    const on = state.rows[+row.dataset.i] === el;
    row.setAttribute("aria-selected", on);
    if (on) row.scrollIntoView({ block: "nearest" });
  }
  render(el);
  draw();
}

function row(dl, label, value) {
  if (value === null || value === undefined || value === "") return;
  dl.insertAdjacentHTML("beforeend",
    `<dt>${label}</dt><dd>${value}</dd>`);
}
const esc = s => String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

function render(el) {
  const box = $("detail");
  if (!el) {
    box.innerHTML = `<div class="sect"><div class="label">Element</div>
      <p class="empty">Click a box, or press <kbd>&darr;</kbd> to walk the page
      in reading order.</p></div>`;
    return;
  }
  const t = tier(el), p = el.provenance || {}, c = el.confidence || {};
  const ty = el.typography || {}, lay = el.layout || {};
  const styles = ["bold", "italic", "serif", "monospace", "superscript"]
    .filter(k => ty[k]).join(" · ");

  // Only whole lines are editable. A `text_span` is a fragment of its line
  // and a `table_cell` of its table, so correcting one would leave the
  // parent's own text stale and the two would disagree about the page.
  const editable = el.text != null && state.top.includes(el);

  box.innerHTML = `<div class="sect">
    <div class="label" style="margin-bottom:8px">Element</div>
    <div class="claim"><b>${esc(el.type)}</b>${el.id ? ` &middot; ${esc(el.id)}` : ""}</div>
    ${p.original_text ? `<div class="was">${esc(p.original_text)}</div>` : ""}
    ${el.text != null ? `<div class="said${el.direction === "rtl" ? " rtl" : ""}"
      ${editable ? `id="edit" contenteditable="true" spellcheck="false"` : ""}
      >${esc(el.text)}</div>` : ""}
    ${editable ? `<div class="editbar" hidden>
      <button id="save">Save</button><button id="revert">Cancel</button>
      <span class="hint">Ctrl+Enter</span><span class="err"></span></div>` : ""}
  </div>
  <div class="sect"><dl id="kv"></dl></div>
  <div class="sect"><details><summary>Raw JSON</summary><pre></pre></details></div>`;

  const dl = $("kv");
  row(dl, "Trust", `<span class="sw" style="background:${colourOf(el)}"></span>${t}` +
    (c.value !== undefined ? ` ${Number(c.value).toFixed(2)}` : ""));
  row(dl, "Source", esc(p.source || "&mdash;"));
  row(dl, "Engine", p.engine ? esc(p.engine) + (p.version ? ` ${esc(p.version)}` : "") : null);
  row(dl, "Raw score", p.raw_confidence !== undefined && p.raw_confidence !== null
    ? Number(p.raw_confidence).toFixed(3) : null);
  row(dl, "Order", el.reading_order);
  row(dl, "Script", el.script);
  row(dl, "Direction", el.direction);
  row(dl, "Font", ty.font_family
    ? `${esc(ty.font_family)}${ty.font_size ? ` ${+ty.font_size.toFixed(1)}pt` : ""}` : null);
  row(dl, "Style", styles || null);
  row(dl, "Align", lay.alignment);
  row(dl, "Indent", lay.indent !== undefined && lay.indent !== null
    ? Math.round(lay.indent) + "px" : null);
  if (el.grid) row(dl, "Cell", `r${el.grid.row} c${el.grid.column}` +
    (el.grid.row_span > 1 || el.grid.column_span > 1
      ? ` span ${el.grid.row_span}×${el.grid.column_span}` : "") +
    (el.grid.is_header ? " &middot; header" : ""));
  const b = el.geometry.bbox;
  row(dl, "Box", `${Math.round(b.x)} ${Math.round(b.y)} ` +
    `${Math.round(b.width)}×${Math.round(b.height)}`);
  if (el.children && el.children.length) row(dl, "Children", el.children.length);

  box.querySelector("pre").textContent = JSON.stringify(el, null, 2);
  if (editable) wireEdit(el);
}

/* The only writer. `edit_text` runs server-side on the cached Document, so
   provenance rules — source unchanged, original_text kept from the FIRST
   edit — hold here exactly as they do for any other caller. */
function wireEdit(el) {
  const box = $("edit"), bar = box.nextElementSibling, err = bar.querySelector(".err");
  const before = el.text;
  const dirty = () => box.innerText !== before;

  box.oninput = () => { bar.hidden = !dirty(); err.textContent = ""; };
  box.onkeydown = ev => {
    if (ev.key === "Escape") { ev.stopPropagation(); cancel(); box.blur(); }
    else if (ev.key === "Enter" && (ev.ctrlKey || ev.metaKey)) { ev.preventDefault(); save(); }
  };
  $("revert").onclick = cancel;
  $("save").onclick = save;

  function cancel() { box.innerText = before; bar.hidden = true; err.textContent = ""; }

  async function save() {
    $("save").disabled = true;
    const body = await send("/api/edit", { id: el.id, text: box.innerText });
    if (!body) { err.textContent = "not saved"; $("save").disabled = false; return; }
    patch(el, body.element);
    census(); buildOutline(); select(el);
  }
}

/* ── census and trust bar ─────────────────────────────────────── */

function census() {
  const counts = {}, total = state.elements.length;
  for (const el of state.elements) counts[tier(el)] = (counts[tier(el)] || 0) + 1;

  $("trust").innerHTML = Object.keys(TIERS).map(k => counts[k]
    ? `<div style="flex:${counts[k]};background:${TIERS[k].c};opacity:${
        state.hidden.has(k) ? .2 : 1}"></div>` : "").join("")
    || `<div style="flex:1;background:var(--hair)"></div>`;

  $("census").innerHTML = Object.keys(TIERS).map(k =>
    `<button class="tier" data-tier="${k}" aria-pressed="${!state.hidden.has(k)}"
       title="${counts[k] || 0} of ${total} &mdash; click to hide">
       <i style="background:${TIERS[k].c}"></i><b>${k}</b><span>${counts[k] || 0}</span>
     </button>`).join("");

  for (const btn of $("census").children) btn.onclick = () => {
    const k = btn.dataset.tier;
    state.hidden.has(k) ? state.hidden.delete(k) : state.hidden.add(k);
    if (state.selected && state.hidden.has(tier(state.selected))) select(null);
    census(); buildOutline(); draw();
  };
}

/* ── page load ────────────────────────────────────────────────── */

async function load(index) {
  const res = await fetch(`/api/page?page=${index}`);
  const data = await res.json();
  if (data.error) {
    $("verdict").className = "verdict v-failed";
    $("verdict").innerHTML = `<b>${esc(data.error)}</b>`;
    return;
  }

  const p = data.page;
  state.index = data.index;
  state.selected = state.hovered = null;
  state.top = (p.elements || []).concat(p.diagnostic_elements || []);
  state.elements = flatten(p.elements).concat(flatten(p.diagnostic_elements));

  $("file").textContent = data.filename || "(stream)";
  $("pageno").textContent = `${data.index + 1} / ${data.page_count}`;
  $("prev").disabled = data.index === 0;
  $("next").disabled = data.index >= data.page_count - 1;

  $("verdict").className = `verdict v-${p.status}`;
  $("verdict").innerHTML =
    `<b>${esc(p.status)}</b><span class="label">${esc(p.source_type)}</span>`;

  const issues = (p.errors || []).map(i => [i, "err"])
    .concat((p.warnings || []).map(i => [i, ""]))
    .concat(importIssues(data.index));
  $("issues").innerHTML = issues.map(([i, cls]) =>
    `<div class="issue ${cls}"><span>&#9888;</span><div>
       <code>${esc(i.code)}</code><p>${esc(i.message)}</p></div></div>`).join("");

  setHistory(data.history);
  census();
  buildOutline();
  render(null);

  const img = new Image();
  // Twice: the first draw sizes the canvas, which is what makes the
  // vertical scrollbar appear, which changes the width the fit was
  // measured against. One frame later that has settled.
  img.onload = () => { state.image = img; draw(); requestAnimationFrame(draw); };
  img.src = `/api/image?page=${index}`;
}

/* Up/Down walks reading order — the thing this project actually measures. */
function step(delta) {
  const list = state.rows;
  if (!list.length) return;
  const at = list.indexOf(state.selected);
  select(list[Math.max(0, Math.min(list.length - 1, at + delta))] || list[0]);
}

$("prev").onclick = () => load(state.index - 1);
$("next").onclick = () => load(state.index + 1);
$("undo").onclick = () => timeTravel("/api/undo");
$("redo").onclick = () => timeTravel("/api/redo");
$("export").onclick = async () => {
  $("export").disabled = true;
  toast("Exporting…");
  const body = await send("/api/export", {});
  if (body) toast(`Wrote ${body.path}`);
  $("export").disabled = false;
};

/* ── zoom, labels, theme ──────────────────────────────────────── */

const ZOOM = [0.5, 0.75, 1, 1.5, 2, 3, 4];

function setZoom(value) {
  state.zoom = Math.min(ZOOM[ZOOM.length - 1], Math.max(ZOOM[0], value));
  // Zoomed in, the page is wider than the bench and has to be pannable; at
  // fit it never is, and a scrollbar there would be a measurement artefact.
  $("bench").style.overflowX = state.zoom > 1 ? "auto" : "hidden";
  // Now, then again once the scrollbar it just toggled has reflowed.
  // Deferring the only draw leaves the page stale if the frame is
  // throttled, which a background tab does.
  draw();
  requestAnimationFrame(draw);
}
const zoomStep = dir => setZoom(
  ZOOM[Math.min(ZOOM.length - 1, Math.max(0, ZOOM.indexOf(state.zoom) + dir))]
    ?? state.zoom);

$("zoomIn").onclick = () => zoomStep(1);
$("zoomOut").onclick = () => zoomStep(-1);
$("zoomFit").onclick = () => setZoom(1);

$("labels").onclick = () => {
  state.labels = !state.labels;
  $("labels").setAttribute("aria-pressed", state.labels);
  draw();
};

function setTheme(name) {
  document.documentElement.dataset.theme = name;
  try { localStorage.setItem("docyx-theme", name); } catch (e) { /* private mode */ }
  draw();  // the scrim and handle strokes are theme-coloured
}
$("theme").onclick = () =>
  setTheme(document.documentElement.dataset.theme === "light" ? "dark" : "light");

$("import").onclick = async () => {
  $("import").disabled = true;
  toast("Reading saved edits…");
  const report = await send("/api/import", {});
  $("import").disabled = false;
  if (!report) return;
  state.conflicts = report.conflicts || [];
  state.orphans = report.orphans || [];
  const unplaced = state.conflicts.length + state.orphans.length;
  const parts = [`${report.applied} reattached`];
  if (state.conflicts.length) parts.push(`${state.conflicts.length} conflicted`);
  if (state.orphans.length) parts.push(`${state.orphans.length} orphaned`);
  toast(parts.join(" · "), unplaced > 0);
  load(state.index);
};

document.addEventListener("keydown", e => {
  // Undo stays live while typing: it is the escape hatch from a bad edit.
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") {
    e.preventDefault();
    timeTravel(e.shiftKey ? "/api/redo" : "/api/undo");
    return;
  }
  if (e.target.isContentEditable || e.target.tagName === "SUMMARY") return;
  if (e.key === "+" || e.key === "=") { zoomStep(1); return; }
  if (e.key === "-") { zoomStep(-1); return; }
  if (e.key === "0") { setZoom(1); return; }
  if (e.key.toLowerCase() === "l") { $("labels").click(); return; }
  if (e.key === "ArrowLeft" && state.index > 0) load(state.index - 1);
  else if (e.key === "ArrowRight" && !$("next").disabled) load(state.index + 1);
  else if (e.key === "ArrowDown") { e.preventDefault(); step(1); }
  else if (e.key === "ArrowUp") { e.preventDefault(); step(-1); }
  else if (e.key === "Escape") select(null);
  else return;
});
try { setTheme(localStorage.getItem("docyx-theme") || "dark"); }
catch (e) { setTheme("dark"); }
window.addEventListener("resize", draw);
load(0);
</script>
